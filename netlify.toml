[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the Render backend — must come before the SPA
# catch-all below, since redirects are matched in order.
[[redirects]]
  from = "/api/*"
  to = "https://backend-kp41.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
